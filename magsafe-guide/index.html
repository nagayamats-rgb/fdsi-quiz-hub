<script>
var quizData = [
  {t: "MagSafeの主なメリットとして最も適切なものはどれですか？", o: [{x: "磁力による正確な位置合わせと安定した充電", ok: true}, {x: "全てのワイヤレス充電器で15Wの高速充電が可能", ok: false}, {x: "iPhoneのバッテリー寿命を大幅に延長する", ok: false}, {x: "データ転送も同時に行える", ok: false}], e: "MagSafeは充電コイルの位置ずれを防ぎ、効率的なワイヤレス充電を可能にします。充電が安定し、手間がかかりません。"},
  {t: "MagSafe充電に正式対応しているiPhoneモデルはどれですか？", o: [{x: "iPhone 12シリーズ以降", ok: true}, {x: "iPhone X以降", ok: false}, {x: "iPhone 8以降", ok: false}, {x: "iPhone 11シリーズ以降", ok: false}], e: "MagSafeはiPhone 12シリーズで初めて導入されました。それ以前のモデルはQi充電のみ対応です。"},
  {t: "Apple純正のMagSafe充電器を使用した場合、対応するiPhoneへの最大充電速度は何Wですか？", o: [{x: "15W", ok: true}, {x: "7.5W", ok: false}, {x: "20W", ok: false}, {x: "10W", ok: false}], e: "iPhone 12以降の対応モデルでは最大15Wの高速充電が可能です。ただし、電源アダプタも20W以上が必要です。"},
  {t: "MagSafe非対応のiPhoneをMagSafe充電器に置いた場合、どうなりますか？", o: [{x: "Qiワイヤレス充電器として低速で充電される", ok: true}, {x: "磁力で吸着はするが充電はされない", ok: false}, {x: "充電器が故障する可能性がある", ok: false}, {x: "充電はされるが、本体が異常に発熱する", ok: false}], e: "MagSafe充電器はQi互換。非対応iPhoneでもQi充電器として利用可能ですが、磁力吸着や15W高速充電はできません。"},
  {t: "MagSafe充電器を最大限に活用するために、どのようなiPhoneケースを選ぶべきですか？", o: [{x: "MagSafe対応の磁気リングが内蔵されたケース", ok: true}, {x: "薄型で軽量なクリアケース", ok: false}, {x: "金属製の頑丈なケース", ok: false}, {x: "バッテリー内蔵型ケース", ok: false}], e: "MagSafe対応ケースは内蔵された磁石で充電器にしっかり吸着し、安定した高速充電をサポートします。"},
  {t: "Apple純正のMagSafeアクセサリを見分けるポイントとして適切なものはどれですか？", o: [{x: "Appleのロゴがあり、MFi認証マークがある", ok: true}, {x: "非常に安価で、デザインがシンプル", ok: false}, {x: "パッケージに「MagSafe Compatible」と記載されている", ok: false}, {x: "磁力が非常に強く、簡単に外れない", ok: false}], e: "純正品はAppleロゴとMFi（Made for iPhone）認証の有無が重要な指標です。パッケージも確認しましょう。"},
  {t: "「MagSafe充電器」と「MagSafeデュアル充電パッド」の主な違いは何ですか？", o: [{x: "デュアル充電パッドはiPhoneとApple Watchを同時に充電できる", ok: true}, {x: "デュアル充電パッドの方がiPhoneへの充電速度が速い", ok: false}, {x: "デュアル充電パッドは有線接続も可能", ok: false}, {x: "デュアル充電パッドはモバイルバッテリーとしても使える", ok: false}], e: "デュアル充電パッドはiPhoneとApple Watchを同時にワイヤレス充電できるため、旅行などに便利です。"},
  {t: "MagSafe対応iPhoneを一般的なQiワイヤレス充電器で充電した場合、どうなりますか？", o: [{x: "磁力での吸着はしないが、Qi規格の速度で充電される", ok: true}, {x: "全く充電されない", ok: false}, {x: "磁力で吸着し、MagSafeと同じ速度で充電される", ok: false}, {x: "異常発熱や故障の原因となる", ok: false}], e: "Qi充電器はMagSafe充電器と互換性がありますが、磁力吸着や15W高速充電は利用できません。"},
  {t: "MagSafe充電器以外に、MagSafeの磁力を活用した一般的なiPhoneアクセサリはどれですか？", o: [{x: "MagSafe対応ウォレット、モバイルバッテリー、車載ホルダー", ok: true}, {x: "有線イヤホン、Lightningケーブル、USBハブ", ok: false}, {x: "スマートウォッチ、Bluetoothスピーカー、タブレット", ok: false}, {x: "キーボード、マウス、外付けSSD", ok: false}], e: "MagSafeは充電以外にも、ウォレット、バッテリー、車載ホルダーなど、磁気吸着型アクセサリで幅広く使えます。"},
  {t: "サードパーティ製のMagSafe対応アクセサリを選ぶ際に、最も重視すべき点は何ですか？", o: [{x: "MFi認証の有無や、信頼できるブランドであること", ok: true}, {x: "価格が非常に安いこと", ok: false}, {x: "斬新なデザインであること", ok: false}, {x: "パッケージが豪華であること", ok: false}], e: "MFi（Made for iPhone）認証はAppleが定める基準を満たしている証です。信頼できるブランドを選びましょう。"},
  {t: "MagSafe対応ウォレットにクレジットカードを収納した場合、カードの磁気情報への影響について正しいものはどれですか？", o: [{x: "Apple純正MagSafeウォレットは磁気シールドが施されているので安全", ok: true}, {x: "全てのクレジットカードが磁気不良を起こす可能性がある", ok: false}, {x: "非接触決済機能を持つカードは影響を受けない", ok: false}, {x: "カードの向きを工夫すれば問題ない", ok: false}], e: "Apple純正MagSafeウォレットは特殊なシールドで磁気情報を保護しています。他社製品は確認が必要です。"},
  {t: "MagSafeバッテリーパックの便利な使い方として、最も適切なものはどれですか？", o: [{x: "iPhoneに吸着させ、外出先で手軽にワイヤレス充電できる", ok: true}, {x: "iPhoneを充電しながら、同時にバッテリーパックも有線充電できる（パススルー充電）", ok: false}, {x: "iPhoneとバッテリーパックを重ねて持ち運ぶと、バッテリー寿命が延びる", ok: false}, {x: "バッテリーパック自体がiPhoneのスタンドとして機能する", ok: false}], e: "MagSafeバッテリーパックはiPhoneに磁気で吸着し、ワイヤレス充電を開始。パススルー充電にも対応。"},
  {t: "iOS 17で追加された「スタンバイ」機能は、MagSafeとどのように関連していますか？", o: [{x: "MagSafe対応充電スタンドに横向きで置くと、時計やウィジェットを表示する", ok: true}, {x: "MagSafeバッテリーパックを装着すると、バッテリー残量を常に表示する", ok: false}, {x: "MagSafe充電中にiPhoneを振ると、特別なアニメーションが表示される", ok: false}, {x: "MagSafe充電時に自動で低電力モードに切り替わる", ok: false}], e: "スタンバイ機能は、MagSafe対応充電スタンドにiPhoneを横置き時、スマートディスプレイとして活用する機能です。"},
  {t: "MagSafe対応iPhoneがMagSafe充電器で15Wの最大速度で充電されない場合、最も可能性の高い原因は何ですか？", o: [{x: "20W以上のUSB-C電源アダプタを使用していない", ok: true}, {x: "iPhoneのバッテリー残量が80%以上である", ok: false}, {x: "充電器が純正品ではない", ok: false}, {x: "iPhoneケースが薄すぎる", ok: false}], e: "MagSafeの15W高速充電には、20W以上のUSB-C PD対応電源アダプタが必須。非対応だと低速になります。"},
  {t: "MagSafe非対応のケースに貼り付ける「MagSafeリング」の主な目的は何ですか？", o: [{x: "MagSafe充電器やアクセサリの磁気吸着力を高めるため", ok: true}, {x: "ケースの耐衝撃性を向上させるため", ok: false}, {x: "iPhoneの放熱性を高めるため", ok: false}, {x: "ケースのデザインをカスタマイズするため", ok: false}], e: "MagSafeリングは、非対応ケースに磁気吸着機能を追加。充電速度はケースの厚みや素材に影響されます。 <a href="https://worldselect.net/products/magsafe-charger-2?utm_source=fds_quiz&utm_medium=quiz_link&utm_campaign=magsafe-guide" target="_blank" rel="noopener" style="color:#88619A;font-weight:600;">▶ MagSafe充電器 15Wを見る</a> <a href="https://item.rakuten.co.jp/world11select/magsafe-charger-2/" target="_blank" style="display:inline-block;padding:2px 8px;background:#dc2626;color:#fff;border-radius:99px;font-size:10px;font-weight:700;text-decoration:none;margin-left:4px;vertical-align:middle">楽天</a> <a href="https://store.shopping.yahoo.co.jp/world1select/ws-magsafe-charger-15w-2.html" target="_blank" style="display:inline-block;padding:2px 8px;background:#dc2626;color:#fff;border-radius:99px;font-size:10px;font-weight:700;text-decoration:none;margin-left:2px;vertical-align:middle">Yahoo</a>"}
];

var LEVELS = [
  {min: Math.ceil(15*0.9), level: "エキスパート", color: "#7c3aed", desc: "完璧な知識！周りへのアドバイス役にぴったり。"},
  {min: Math.ceil(15*0.7), level: "上級者", color: "--c-plum", desc: "しっかりした知識をお持ちです。"},
  {min: Math.ceil(15*0.5), level: "中級者", color: "#34c759", desc: "基本はOK。もう少し深掘りするとさらに安心。"},
  {min: 0, level: "初級者", color: "#d97706", desc: "ここから学ぶと選び方が変わります！"}
];

var cur = 0, score = 0, answered = false;

function render() {
  var q = quizData[cur];
  document.getElementById('progressFill').style.width = ((cur / quizData.length) * 100) + '%';
  document.getElementById('questionNumber').textContent = 'Q' + (cur + 1) + ' / ' + quizData.length;
  document.getElementById('questionText').textContent = q.t;
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('nextBtn').textContent = '答えを見る';
  answered = false;
  var opts = shuffle(q.o.slice());
  var c = document.getElementById('optionsContainer');
  c.innerHTML = '';
  opts.forEach(function(o, i) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = o.x;
    btn.dataset.ok = o.ok;
    btn.onclick = function() { choose(btn, opts); };
    c.appendChild(btn);
  });
}

function choose(btn, opts) {
  if (answered) return;
  answered = true;
  var correct = btn.dataset.ok === 'true';
  if (correct) { score++; btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); }
  document.querySelectorAll('.option').forEach(function(b) {
    b.classList.add('answered');
    if (b.dataset.ok === 'true') b.classList.add('correct');
  });
  var exp = document.getElementById('explanation');
  exp.innerHTML = quizData[cur].e;
  exp.classList.add('show');
  document.getElementById('nextBtn').textContent = cur < quizData.length - 1 ? '次の問題 →' : '結果を見る';
}

document.getElementById('nextBtn').addEventListener('click', function() {
  if (!answered) return;
  cur++;
  if (cur < quizData.length) { render(); }
  else { showResult(); }
});

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('resultScore').textContent = score + ' / ' + quizData.length;
  var lv = LEVELS[LEVELS.length - 1];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].min) { lv = LEVELS[i]; break; }
  }
  var el = document.getElementById('resultLevel');
  el.textContent = lv.level;
  el.style.background = lv.color;
  document.getElementById('resultDesc').textContent = lv.desc;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  render();
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

render();
</script>
