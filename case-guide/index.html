<script>
/* WS quiz funnel: quiz_start / quiz_complete / quiz_share.
   Wraps the page's own global quiz functions when (and only when) they exist.
   Every hook is try/catch guarded and always returns the original return value,
   so a measurement failure can never break the quiz itself. */
(function(){
  var fired={};
  function path(){try{return location.pathname;}catch(_){return "";}}
  function send(name,params){
    try{if(typeof gtag==="function"){gtag("event",name,params||{});}}catch(_){}
  }
  function sendOnce(name,params){
    if(fired[name])return;
    fired[name]=1;
    send(name,params);
  }
  function wrap(name,hook){
    try{
      var orig=window[name];
      if(typeof orig!=="function")return false;
      if(orig.__wsGa4Wrapped)return true;
      var wrapped=function(){
        try{hook();}catch(_){}
        return orig.apply(this,arguments);
      };
      try{wrapped.__wsGa4Wrapped=true;}catch(_){}
      window[name]=wrapped;
      return window[name]!==orig;
    }catch(_){return false;}
  }
  /* Candidate names, most specific first. Only the FIRST one that exists on the
     page is wrapped, so a page owning several of them can never double-fire.
     NOTE: academy's showLevelResult is deliberately NOT a completion candidate:
     it fires on every intermediate level result and would corrupt quiz_complete. */
  var START_FNS=["submitAnswer","selectOption","choose","selectAnswer","answerQuestion"];
  var COMPLETE_FNS=["showResult","renderResult","showFinalResult"];
  function wrapFirst(names,hook){
    for(var i=0;i<names.length;i++){
      try{
        if(typeof window[names[i]]==="function"){
          wrap(names[i],hook);
          return names[i];
        }
      }catch(_){}
    }
    return null;
  }
  function setup(){
    try{
      wrapFirst(START_FNS,function(){sendOnce("quiz_start",{quiz_path:path()});});
      wrapFirst(COMPLETE_FNS,function(){sendOnce("quiz_complete",{quiz_path:path()});});
      var shares=["shareLine","shareTwitter","copyResult"];
      for(var i=0;i<shares.length;i++){
        (function(n){
          wrap(n,function(){send("quiz_share",{quiz_path:path(),method:n});});
        })(shares[i]);
      }
    }catch(_){}
  }
  try{
    if(document.readyState==="loading"){
      document.addEventListener("DOMContentLoaded",setup);
    }else{
      setup();
    }
  }catch(_){try{setup();}catch(__){}}
})();

var LEVELS = [
  {min: Math.ceil(15*0.9), level: "エキスパート", color: "#7c3aed", desc: "完璧な知識！周りへのアドバイス役にぴったり。"},
  {min: Math.ceil(15*0.7), level: "上級者", color: "--c-grape", desc: "しっかりした知識をお持ちです。"},
  {min: Math.ceil(15*0.5), level: "中級者", color: "#34c759", desc: "基本はOK。もう少し深掘りするとさらに安心。"},
  {min: 0, level: "初級者", color: "#d97706", desc: "ここから学ぶと選び方が変わります！"}
];

var cur = 0, score = 0, answered = false;

function render() {
  var q = quizData[cur];
  document.getElementById('progressFill').style.width = ((cur / quizData.length) * 100) + '%';
  document.getElementById('questionNumber').textContent = 'Q' + (cur + 1) + ' / ' + quizData.length;
  document.getElementById('questionText').textContent = q.t;
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('nextBtn').textContent = '答えを見る';
  answered = false;
  var opts = shuffle(q.o.slice());
  var c = document.getElementById('optionsContainer');
  c.innerHTML = '';
  opts.forEach(function(o, i) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = o.x;
    btn.dataset.ok = o.ok;
    btn.onclick = function() { choose(btn, opts); };
    c.appendChild(btn);
  });
}

function choose(btn, opts) {
  if (answered) return;
  answered = true;
  var correct = btn.dataset.ok === 'true';
  if (correct) { score++; btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); }
  document.querySelectorAll('.option').forEach(function(b) {
    b.classList.add('answered');
    if (b.dataset.ok === 'true') b.classList.add('correct');
  });
  var exp = document.getElementById('explanation');
  exp.innerHTML = quizData[cur].e;
  exp.classList.add('show');
  document.getElementById('nextBtn').textContent = cur < quizData.length - 1 ? '次の問題 →' : '結果を見る';
}

document.getElementById('nextBtn').addEventListener('click', function() {
  if (!answered) return;
  cur++;
  if (cur < quizData.length) { render(); }
  else { showResult(); }
});

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('resultScore').textContent = score + ' / ' + quizData.length;
  var lv = LEVELS[LEVELS.length - 1];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].min) { lv = LEVELS[i]; break; }
  }
  var el = document.getElementById('resultLevel');
  el.textContent = lv.level;
  el.style.background = lv.color;
  document.getElementById('resultDesc').textContent = lv.desc;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  render();
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

render();
</script>
