var cur = 0, occ = 'xmas', picks = [];

function $(id){ return document.getElementById(id); }
function show(id){
  ['intro','quiz','result'].forEach(function(k){ $(k).classList.toggle('on', k===id); });
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){ window.scrollTo(0,0); }
}
function startQuiz(o){ occ = o; cur = 0; picks = []; show('quiz'); render(); }
function render(){
  var q = Q[cur], d = $('dots'), i;
  d.innerHTML = '';
  for (i = 0; i < Q.length; i++){ var b = document.createElement('i'); if (i < cur) b.className = 'done'; d.appendChild(b); }
  $('qno').textContent = 'Q' + (cur+1) + ' / ' + Q.length;
  $('qno').style.setProperty('--i',0); $('qno').classList.remove('wsm-rise'); void $('qno').offsetWidth; $('qno').classList.add('wsm-rise');
  var qt = $('qtext'); qt.innerHTML = ''; var sp = document.createElement('span'); sp.className = 'wsm-mask-in'; sp.textContent = q.t; qt.appendChild(sp);
  var box = $('opts'); box.innerHTML = '';
  q.o.forEach(function(op, k){
    var btn = document.createElement('button'); btn.type = 'button';
    btn.innerHTML = '<span class="em" aria-hidden="true">' + ic(op.e) + '</span><span></span>';
    btn.lastChild.textContent = op.x;
    btn.className = 'wsm-rise'; btn.style.setProperty('--i', k+1);
    btn.onclick = function(){ choose(k, btn); };
    box.appendChild(btn);
  });
  $('backBtn').style.visibility = cur > 0 ? 'visible' : 'hidden';
}
function choose(k, btn){
  if (btn) btn.classList.add('picked');
  picks[cur] = k;
  setTimeout(function(){
    if (cur < Q.length - 1){ cur++; render(); } else { showResult(); }
  }, 260);
}
function goBack(){ if (cur > 0){ cur--; picks.length = cur; render(); } }
function score(){
  var s = {}; ORDER.forEach(function(k){ s[k] = 0; });
  picks.forEach(function(k, qi){ var w = Q[qi].o[k].s; for (var t in w) s[t] += w[t]; });
  var best = ORDER[0]; ORDER.forEach(function(k){ if (s[k] > s[best]) best = k; });
  return best;
}
function showResult(){ paintResult(score(), false); }

  var base = 'https://quiz.fds.co.jp/gift-uranai/';
  var consult = base + '?r=' + k + '&o=' + occ + '&utm_source=line&utm_medium=share&utm_campaign=gift-uranai&utm_content=consult';

    '<p class="sh-h">この結果をどうする？</p>' +
    '<a class="sh-a line" data-m="consult" href="https://line.me/R/share?text=' + encodeURIComponent(msgConsult + '\n' + consult) + '" target="_blank" rel="noopener"><b>家族や友だちに相談する</b><span>LINE で、この結果のページを送ります</span></a>' +
    '<a class="sh-a line" data-m="invite" href="https://line.me/R/share?text=' + encodeURIComponent(msgInvite + '\n' + invite) + '" target="_blank" rel="noopener"><b>友だちにも占ってもらう</b><span>LINE で、占いのはじめのページを送ります</span></a>' +
    '<a class="sh-a x" data-m="x" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent('ガジェット占いで「' + t.name + 'タイプ」でした！ あの人にぴったりの贈り物がわかる5問') + '&url=' + encodeURIComponent(inviteX) + '" target="_blank" rel="noopener"><b>X でシェア</b><span>占いのはじめのページを紹介します</span></a>' +
    '<p class="note">※ 贈る相手ご本人に送ると、プレゼントがバレちゃうかも。</p>';
  Array.prototype.forEach.call($('share').querySelectorAll('.sh-a'), function(a){ a.addEventListener('click', function(){ try { if (typeof gtag === 'function') gtag('event','gift_share',{method:a.getAttribute('data-m'), gift_type:k}); } catch(_){} }); });
